name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Cheap static checks first, so a typo fails in seconds and is never
      # hidden behind a browser-test failure.
      - name: Check generated markup matches data/portfolio.json
        run: npm run check:generated

      - name: Syntax-check JavaScript
        run: npm run check:syntax

      - name: Run site structure tests
        run: npm run test:structure

      - name: Verify anonymous counter validation and aggregation
        run: npm run test:counter

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
